name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install known site builders so the workflow can build if they're not in requirements
          pip install --upgrade mkdocs mkdocs-material sphinx || true

      - name: Build site (MkDocs or Sphinx)
        run: |
          # Prefer MkDocs if mkdocs.yml exists
          if [ -f mkdocs.yml ]; then
            mkdocs build --clean -d site
          # Else, build Sphinx docs if docs/conf.py exists
          elif [ -d docs ] && [ -f docs/conf.py ]; then
            cd docs
            # Use Makefile if present, otherwise use sphinx-build directly
            if [ -f Makefile ]; then
              make html
              cd ..
              # Sphinx default output location varies; common location is docs/_build/html
              if [ -d docs/_build/html ]; then
                mv docs/_build/html site
              fi
            else
              sphinx-build -b html docs docs/_build/html
              mv docs/_build/html site
            fi
          else
            echo "No mkdocs.yml or docs/conf.py found; creating a simple placeholder site"
            mkdir -p site
            echo "<!doctype html><html><body><h1>Pages deployed</h1></body></html>" > site/index.html
          fi

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
